<template>
    <lightning-quick-action-panel header={labels.title}>
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text={labels.loading}></lightning-spinner>
            </template>

            <div class="slds-box slds-theme_info slds-m-bottom_medium" role="status">
                <p>{labels.message}</p>
            </div>

            <lightning-combobox
                class="slds-m-bottom_small"
                label={labels.reason}
                value={motivo}
                options={reasonOptions}
                onchange={handleReasonChange}
                message-when-value-missing={labels.reasonRequired}
                required>
            </lightning-combobox>

            <lightning-textarea
                label={labels.comment}
                value={comentarioEntrada}
                onchange={handleCommentChange}
                message-when-value-missing={labels.commentRequired}
                required>
            </lightning-textarea>
        </div>

        <div slot="footer" class="slds-grid slds-grid_align-end slds-gutters_x-small">
            <lightning-button
                label={labels.cancel}
                onclick={handleCancel}
                disabled={isLoading}>
            </lightning-button>
            <lightning-button
                class="slds-m-left_x-small"
                variant="brand"
                label={labels.confirm}
                onclick={handleConfirm}
                disabled={isLoading}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
