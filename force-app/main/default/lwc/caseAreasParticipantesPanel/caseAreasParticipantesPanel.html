<template>
    <lightning-card title={labels.title} icon-name="standard:skill_requirement">
        <template if:true={loading}>
            <div class="slds-p-around_medium">
                <lightning-spinner size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={loading}>

            <!-- ── Vista de detalhes (inline, substitui a lista) ── -->
            <template if:true={showDetailModal}>
                <div class="detail-panel">
                    <div class="detail-panel-header">
                        <button type="button" class="detail-back-btn" onclick={closeDetailModal}>← {labels.back}</button>
                        <h3 class="detail-panel-title">{labels.detailTitle}</h3>
                    </div>
                    <div class="detail-panel-body">
                        <div class="detail-header">
                            <span class="area-pill">{selectedItem.areaDisplayLabel}</span>
                            <span class="card-type-label">{selectedItem.areaTypePillLabel}</span>
                        </div>
                        <div class={selectedItem.statusLineClass}>{selectedItem.statusLine}</div>

                        <div class="slds-grid slds-wrap slds-gutters_small slds-m-top_small">
                            <div class="slds-col slds-size_1-of-2">
                                <p class="detail-label">{labels.start}</p>
                                <p class="detail-value">{selectedItem.startText}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <p class="detail-label">{labels.deadline}</p>
                                <p class="detail-value">{selectedItem.deadlineText}</p>
                            </div>
                            <template if:true={selectedItem.isConcluida}>
                                <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                    <p class="detail-label">{labels.completedOn}</p>
                                    <p class="detail-value">{selectedItem.endText}</p>
                                </div>
                            </template>
                            <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                <p class="detail-label">{labels.sequence}</p>
                                <p class="detail-value">{selectedItem.sequenciaText}</p>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters_small slds-m-top_small detail-sla-grid">
                            <div class="slds-col slds-size_1-of-2">
                                <p class="detail-label">{labels.slaTime}</p>
                                <p class="detail-value">{selectedItem.tempoSLAText}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <p class="detail-label">{labels.consumedTime}</p>
                                <p class="detail-value">{selectedItem.tempoConsumidoText}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                <p class="detail-label">{labels.remainingTime}</p>
                                <p class="detail-value">{selectedItem.tempoRestanteText}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                <p class="detail-label">{labels.pausedTime}</p>
                                <p class="detail-value">{selectedItem.tempoPausadoText}</p>
                            </div>
                        </div>

                        <div class="slds-m-top_small">
                            <p class="detail-label">{labels.request}</p>
                            <p class="detail-value">{selectedItem.requestText}</p>
                        </div>
                        <template if:true={selectedItem.comentarioRetorno}>
                            <div class="slds-m-top_small">
                                <p class="detail-label">{labels.returnComment}</p>
                                <p class="detail-value">{selectedItem.comentarioRetorno}</p>
                            </div>
                        </template>
                        <template if:true={selectedItem.solucaoRetorno}>
                            <div class="slds-m-top_small">
                                <p class="detail-label">{labels.solution}</p>
                                <p class="detail-value">{selectedItem.solucaoRetorno}</p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- ── Lista de cards ── -->
            <template if:false={showDetailModal}>
                <div class="slds-p-horizontal_medium slds-p-bottom_small summary-box">
                    <div class="summary-title">{labels.operationalSummary}</div>
                    <div class="summary-row">
                        <div class="summary-text">{summaryText}</div>
                        <div class="summary-actions">
                            <lightning-button variant="neutral" label={labels.refresh} onclick={handleRefresh} disabled={submitting}></lightning-button>
                            <template if:true={canManage}>
                                <lightning-button class="slds-m-left_x-small" variant="brand" label={labels.add} onclick={openAddModal} disabled={submitting}></lightning-button>
                            </template>
                        </div>
                    </div>
                </div>

                <template if:false={hasItems}>
                    <div class="slds-p-around_medium slds-text-color_weak">{labels.empty}</div>
                </template>

                <template if:true={hasItems}>
                    <div class="slds-p-horizontal_small slds-p-bottom_small list-wrap">
                        <div class="group-header" onclick={toggleOpenGroup}>
                            <lightning-icon icon-name={openGroupIcon} size="x-small"></lightning-icon>
                            <span class="group-title">{labels.openGroup}</span>
                            <span class="group-count">({openItems.length})</span>
                        </div>
                        <template if:true={isOpenGroupExpanded}>
                            <template if:true={hasOpenItems}>
                                <template for:each={openItems} for:item="item">
                                    <article key={item.id} class={item.cardClass} data-id={item.id} onclick={handleCardClick}>
                                        <div class="compact-row">
                                            <div class="compact-info">
                                                <span class="area-pill">{item.areaDisplayLabel}</span>
                                                <span class="card-type-label">{item.areaTypePillLabel}</span>
                                            </div>
                                        </div>
                                        <template if:true={item.showProgress}>
                                            <div class="progress-track">
                                                <div class={item.progressBarClass} style={item.progressStyle}></div>
                                            </div>
                                        </template>
                                        <template if:false={item.isStandard}>
                                            <template if:true={item.comentarioSolicitacao}>
                                                <div class="card-comment">{item.comentarioSolicitacao}</div>
                                            </template>
                                        </template>
                                        <div class={item.statusLineClass}>{item.statusLine}</div>
                                        <div class="card-action-links">
                                            <template if:true={item.canClose}>
                                                <button type="button" class="card-action-link" data-id={item.id} onclick={handleCloseIcon} disabled={submitting}>{labels.close}</button>
                                            </template>
                                        </div>
                                    </article>
                                </template>
                            </template>
                        </template>

                        <div class="group-header slds-m-top_small" onclick={toggleDoneGroup}>
                            <lightning-icon icon-name={doneGroupIcon} size="x-small"></lightning-icon>
                            <span class="group-title">{labels.doneGroup}</span>
                            <span class="group-count">({doneItems.length})</span>
                        </div>
                        <template if:true={isDoneGroupExpanded}>
                            <template if:true={hasDoneItems}>
                                <template for:each={doneItems} for:item="item">
                                    <article key={item.id} class={item.cardClass} data-id={item.id} onclick={handleCardClick}>
                                        <div class="compact-row">
                                            <div class="compact-info">
                                                <span class="area-pill">{item.areaDisplayLabel}</span>
                                                <span class="card-type-label">{item.areaTypePillLabel}</span>
                                            </div>
                                        </div>
                                        <template if:true={item.showProgress}>
                                            <div class="progress-track">
                                                <div class={item.progressBarClass} style={item.progressStyle}></div>
                                            </div>
                                        </template>
                                        <div class={item.statusLineClass}>{item.statusLine}</div>
                                    </article>
                                </template>
                            </template>
                        </template>
                    </div>
                </template>
            </template>

        </template>
    </lightning-card>

    <template if:true={showCloseModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">{labels.closeTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label={labels.area} value={selectedItem.areaLabel} disabled></lightning-input>
                    <lightning-input class="slds-m-top_small" label={labels.currentStatus} value={selectedItem.statusLabel} disabled></lightning-input>
                    <lightning-textarea class="slds-m-top_small" label={labels.requestComment} value={selectedItem.comentarioSolicitacao} disabled></lightning-textarea>
                    <lightning-textarea class="slds-m-top_small" label={labels.returnComment} required value={closeComment} onchange={handleCommentChange}></lightning-textarea>
                    <lightning-textarea class="slds-m-top_small" label={labels.solution} required value={closeSolution} onchange={handleSolutionChange}></lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label={labels.cancel} onclick={closeModal}></lightning-button>
                    <lightning-button class="slds-m-left_small" variant="brand" label={labels.confirmClose} onclick={confirmClose} disabled={submitting}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showAddModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <template if:true={isAddStep1}>
                        <h2 class="slds-modal__title slds-hyphenate">{labels.addTitle}</h2>
                    </template>
                    <template if:false={isAddStep1}>
                        <h2 class="slds-modal__title slds-hyphenate">{labels.addStep2Title}</h2>
                    </template>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isAddStep1}>
                        <lightning-dual-listbox
                            name="areas"
                            label={labels.area}
                            source-label={labels.addAvailable}
                            selected-label={labels.addSelected}
                            options={addAreaOptions}
                            value={addAreas}
                            onchange={handleAddAreasChange}
                        ></lightning-dual-listbox>
                    </template>
                    <template if:false={isAddStep1}>
                        <template for:each={addItems} for:item="item">
                            <div key={item.area} class="slds-m-bottom_small">
                                <p class="slds-text-heading_small slds-m-bottom_x-small">{item.areaLabel}</p>
                                <lightning-textarea
                                    label={labels.requestCommentInput}
                                    value={item.comentario}
                                    data-area={item.area}
                                    onchange={handleAddItemComentarioChange}
                                    required
                                ></lightning-textarea>
                            </div>
                        </template>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label={labels.cancel} onclick={closeModal}></lightning-button>
                    <template if:true={isAddStep1}>
                        <lightning-button class="slds-m-left_small" variant="brand" label={labels.next} onclick={handleAddNext} disabled={addNextDisabled}></lightning-button>
                    </template>
                    <template if:false={isAddStep1}>
                        <lightning-button class="slds-m-left_small" variant="neutral" label={labels.back} onclick={handleAddBack}></lightning-button>
                        <lightning-button class="slds-m-left_small" variant="brand" label={labels.confirmAdd} onclick={confirmAdd} disabled={submitting}></lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
