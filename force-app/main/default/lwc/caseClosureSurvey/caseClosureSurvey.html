<template>
    <lightning-quick-action-panel header={labels.closeCaseTitle}>
        <div class="slds-p-around_medium">
            <template if:true={loading}>
                <lightning-spinner alternative-text={labels.loading}></lightning-spinner>
            </template>

            <template if:false={loading}>
                <template if:true={context}>
                    <template if:true={isClosureBlocked}>
                        <div class="slds-box slds-theme_warning slds-m-bottom_medium">
                            <p>{context.categorizationBlockMessage}</p>
                        </div>
                    </template>

                    <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label={labels.caseNumber} value={context.caseNumber} disabled></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label={labels.businessUnit} value={context.businessUnit} disabled></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label={labels.channel} value={context.channel} disabled></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label={labels.closureStatus} value={closureStatusDisplay} disabled></lightning-input>
                        </div>
                    </div>

                    <h3 class="slds-text-title_bold slds-m-bottom_small">{labels.closureDataTitle}</h3>
                    <lightning-combobox
                        class="slds-m-bottom_small"
                        label={labels.closureReason}
                        value={model.closureReason}
                        options={closureReasonOptions}
                        data-field="closureReason"
                        onchange={handleChange}
                        disabled={isClosureReasonPicklistLoading}
                        required>
                    </lightning-combobox>
                    <lightning-textarea
                        class="slds-m-bottom_small"
                        label={labels.closureSolution}
                        value={model.closureSolution}
                        data-field="closureSolution"
                        onchange={handleChange}
                        required>
                    </lightning-textarea>
                    <lightning-textarea
                        label={labels.closureComment}
                        value={model.closureComment}
                        data-field="closureComment"
                        onchange={handleChange}>
                    </lightning-textarea>

                    <template if:true={context.showGerarReclamacaoQuestion}>
                        <h3 class="slds-text-title_bold slds-m-top_medium slds-m-bottom_small">{labels.complaintTitle}</h3>
                        <lightning-input
                            type="checkbox"
                            label={labels.generateComplaintQuestion}
                            checked={model.selectedGerarReclamacao}
                            onchange={handleGerarReclamacaoChange}>
                        </lightning-input>
                    </template>

                    <template if:true={showSurveyInfo}>
                        <div class="slds-box slds-theme_info slds-m-top_medium">
                            <p>{labels.surveyAlwaysInfo}</p>
                        </div>
                    </template>

                    <template if:true={context.showSurveyQuestion}>
                        <h3 class="slds-text-title_bold slds-m-top_medium slds-m-bottom_small">{labels.surveyTitle}</h3>
                        <lightning-radio-group
                            label={labels.sendSurveyQuestion}
                            options={surveyOptions}
                            value={sendSurveyValue}
                            type="radio"
                            onchange={handleSurveyChange}>
                        </lightning-radio-group>

                        <template if:true={context.showDailySurveyIndicator}>
                            <div class="slds-box slds-theme_default slds-m-top_small">
                                <p>{context.surveyAlreadySentMessage}</p>
                            </div>
                        </template>
                    </template>
                </template>
            </template>
        </div>

        <div slot="footer" class="slds-grid slds-grid_align-end slds-gutters_x-small">
            <lightning-button label={labels.cancel} onclick={cancel}></lightning-button>
            <lightning-button
                class="slds-m-left_x-small"
                variant="brand"
                label={labels.close}
                onclick={submit}
                disabled={disableSubmit}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
