<template>
    <div class="page-backdrop">
    <div class="popup-card">
    <lightning-card title={labels.cardTitle} icon-name="standard:case">
        <div class="form-shell slds-p-around_medium">
            <template if:true={loading}>
                <lightning-spinner alternative-text="Carregando"></lightning-spinner>
            </template>

            <template if:true={showRecordTypeGate}>
                <hr class="slds-m-vertical_small" />
                <ul class="record-type-list">
                    <template for:each={recordTypeCards} for:item="card">
                        <li key={card.value}>
                            <button
                                class="record-type-row"
                                data-value={card.value}
                                onclick={handleRecordTypeCardSelect}
                                type="button"
                            >
                                <span class="record-type-radio">{card.radioGlyph}</span>
                                <span class="record-type-content">
                                    <span class="record-type-label">{card.label}</span>
                                    <span class="record-type-description">{card.description}</span>
                                </span>
                            </button>
                        </li>
                    </template>
                </ul>
                <div class="actions-footer">
                    <div class="actions-row slds-grid slds-gutters_small slds-grid_align-center">
                        <lightning-button variant="neutral" label={labels.cancel} onclick={cancel}></lightning-button>
                        <lightning-button variant="brand" label={labels.continueButton} onclick={confirmRecordType} disabled={disableConfirmRecordType}></lightning-button>
                    </div>
                </div>
            </template>

            <template if:false={showRecordTypeGate}>
            <template if:true={loading}>
                <lightning-spinner alternative-text="Carregando"></lightning-spinner>
            </template>

            <template if:false={loading}>
                <div class="slds-section slds-is-open">
                    <h3 class="slds-section__title slds-theme_shade">
                        <span class="slds-truncate slds-p-horizontal_small slds-p-vertical_x-small" title={labels.categorizationTitle}>{labels.categorizationTitle}</span>
                    </h3>
                    <div class="slds-section__content slds-p-around_small">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                <lightning-combobox name="tipoCaso" label={fieldLabels.tipoCaso} value={model.tipoCaso} options={tipoOptions} onchange={handleFieldChange} disabled={disableTipoCaso} required={requiredTipoCaso}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                <lightning-combobox name="categoria" label={fieldLabels.categoria} value={model.categoria} options={categoriaOptions} onchange={handleFieldChange} disabled={disableCategoria} required={requiredCategoria}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                <lightning-combobox name="assunto" label={fieldLabels.assunto} value={model.assunto} options={assuntoOptions} onchange={handleFieldChange} disabled={disableAssunto} required={requiredAssunto}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                <lightning-combobox name="subassunto" label={fieldLabels.subassunto} value={model.subassunto} options={subassuntoOptions} onchange={handleFieldChange} disabled={disableSubassunto} required={requiredSubassunto}></lightning-combobox>
                            </div>
                        </div>

                        <template if:true={showCustomField}>
                            <div class="slds-m-top_small slds-size_1-of-1 slds-large-size_1-of-2">
                                <lightning-combobox name="customField" label={customFieldLabel} value={customFieldValue} options={customFieldOptions} onchange={handleCustomFieldChange}></lightning-combobox>
                            </div>
                        </template>
                    </div>
                </div>

                <template if:true={hasRecordType}>
                    <template if:true={creating}>
                        <lightning-spinner alternative-text="Salvando"></lightning-spinner>
                    </template>

                    <template if:true={hasCuratedSections}>
                        <lightning-record-edit-form
                            object-api-name="Case"
                            record-type-id={model.recordTypeId}
                            onsubmit={handleRecordFormSubmit}
                            onsuccess={handleRecordFormSuccess}
                            onerror={handleRecordFormError}
                        >
                            <template for:each={caseDetailSections} for:item="section">
                                <div key={section.key} class="slds-section slds-is-open">
                                    <h3 class="slds-section__title slds-theme_shade">
                                        <span class="slds-truncate slds-p-horizontal_small slds-p-vertical_x-small" title={section.title}>{section.title}</span>
                                    </h3>
                                    <div class="slds-section__content slds-p-around_small">
                                        <template for:each={section.rows} for:item="row">
                                            <div key={row.key} class="slds-grid slds-wrap slds-gutters slds-m-bottom_small">
                                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                                    <template if:true={row.left}>
                                                        <lightning-input-field field-name={row.left.field} required={row.left.required} onchange={handleDetailFieldChange}></lightning-input-field>
                                                    </template>
                                                </div>
                                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                                    <template if:true={row.right}>
                                                        <lightning-input-field field-name={row.right.field} required={row.right.required} onchange={handleDetailFieldChange}></lightning-input-field>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <div class="slds-section slds-is-open">
                                <h3 class="slds-section__title slds-theme_shade">
                                    <span class="slds-truncate slds-p-horizontal_small slds-p-vertical_x-small" title={labels.destinationTitle}>{labels.destinationTitle}</span>
                                </h3>
                                <div class="slds-section__content slds-p-around_small">
                                    <div class="destination-grid">
                                        <template for:each={destinationCards} for:item="card">
                                            <button
                                                key={card.value}
                                                class={card.cssClass}
                                                data-value={card.value}
                                                onclick={handleDestinationCardSelect}
                                                disabled={card.disabled}
                                                type="button"
                                            >
                                                <div class="destination-radio">{card.radioGlyph}</div>
                                                <div class="destination-content">
                                                    <div class="destination-label">{card.label}</div>
                                                    <div class="destination-description">{card.description}</div>
                                                </div>
                                            </button>
                                        </template>
                                    </div>
                                    <template if:true={assumirBloqueado}>
                                        <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{labels.assumirBloqueadoHint}</div>
                                    </template>
                                    <template if:true={resolvedQueue}>
                                        <lightning-input class="slds-m-top_small" label={labels.queueResolved} value={resolvedQueue.developerName} disabled></lightning-input>
                                    </template>
                                    <template if:true={showQueueSelector}>
                                        <lightning-combobox class="slds-m-top_small" label={labels.manualQueue} value={selectedQueueDeveloperName} options={queueOptions} onchange={handleQueueChange}></lightning-combobox>
                                    </template>
                                </div>
                            </div>

                            <div class="actions-footer">
                                <div class="actions-row slds-grid slds-gutters_small slds-grid_align-center">
                                    <lightning-button variant="neutral" label={labels.cancel} onclick={cancel}></lightning-button>
                                    <lightning-button variant="brand" type="submit" label={labels.save}></lightning-button>
                                </div>
                            </div>
                        </lightning-record-edit-form>
                    </template>

                    <template if:false={hasCuratedSections}>
                        <div class="slds-section slds-is-open">
                            <h3 class="slds-section__title slds-theme_shade">
                                <span class="slds-truncate slds-p-horizontal_small slds-p-vertical_x-small" title={labels.destinationTitle}>{labels.destinationTitle}</span>
                            </h3>
                            <div class="slds-section__content slds-p-around_small">
                                <div class="destination-grid">
                                    <template for:each={destinationCards} for:item="card">
                                        <button
                                            key={card.value}
                                            class={card.cssClass}
                                            data-value={card.value}
                                            onclick={handleDestinationCardSelect}
                                            disabled={card.disabled}
                                            type="button"
                                        >
                                            <div class="destination-radio">{card.radioGlyph}</div>
                                            <div class="destination-content">
                                                <div class="destination-label">{card.label}</div>
                                                <div class="destination-description">{card.description}</div>
                                            </div>
                                        </button>
                                    </template>
                                </div>
                                <template if:true={assumirBloqueado}>
                                    <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{labels.assumirBloqueadoHint}</div>
                                </template>
                                <template if:true={resolvedQueue}>
                                    <lightning-input class="slds-m-top_small" label={labels.queueResolved} value={resolvedQueue.developerName} disabled></lightning-input>
                                </template>
                                <template if:true={showQueueSelector}>
                                    <lightning-combobox class="slds-m-top_small" label={labels.manualQueue} value={selectedQueueDeveloperName} options={queueOptions} onchange={handleQueueChange}></lightning-combobox>
                                </template>
                            </div>
                        </div>

                        <div class="slds-section slds-is-open">
                            <h3 class="slds-section__title slds-theme_shade">
                                <span class="slds-truncate slds-p-horizontal_small slds-p-vertical_x-small" title={labels.caseDetailsTitle}>{labels.caseDetailsTitle}</span>
                            </h3>
                            <div class="slds-section__content slds-p-around_small">
                                <lightning-record-form
                                    object-api-name="Case"
                                    record-type-id={model.recordTypeId}
                                    layout-type="Full"
                                    mode="edit"
                                    onsubmit={handleRecordFormSubmit}
                                    onsuccess={handleRecordFormSuccess}
                                    onerror={handleRecordFormError}
                                    oncancel={cancel}
                                ></lightning-record-form>
                            </div>
                        </div>
                    </template>
                </template>
            </template>
            </template>
        </div>
    </lightning-card>
    </div>
    </div>
</template>
