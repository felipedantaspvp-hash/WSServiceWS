<template>
    <lightning-modal-header label={labels.title}></lightning-modal-header>
    <lightning-modal-body>
        <div class="slds-p-around_medium shell">
            <template if:true={loading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>

            <template if:false={loading}>
                <template if:true={hasContext}>
                <h3 class="slds-text-title_bold slds-m-bottom_small">{labels.caseInfo}</h3>
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label={labels.caseNumber} value={context.caseNumber} disabled></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label={labels.status} value={context.status} disabled></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label={fieldLabels.unidade} value={context.unidadeNegocio} disabled></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label={labels.recordType} value={readOnlyRecordTypeLabel} disabled></lightning-input>
                    </div>
                </div>

                <h3 class="slds-text-title_bold slds-m-bottom_small">{labels.currentCat}</h3>
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label={labels.currentTipo} value={currentTipoCasoDisplay} disabled></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label={labels.currentCategoria} value={currentCategoriaDisplay} disabled></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label={labels.currentAssunto} value={currentAssuntoDisplay} disabled></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input label={labels.currentSubassunto} value={readOnlySubassuntoAtual} disabled></lightning-input>
                    </div>
                </div>

                <h3 class="slds-text-title_bold slds-m-bottom_small">{labels.newCat}</h3>
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox name="tipoCaso" label={fieldLabels.tipo} value={model.tipoCaso} options={tipoOptions} onchange={handleFieldChange} disabled={disableTipo} required></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox name="categoria" label={fieldLabels.categoria} value={model.categoria} options={categoriaOptions} onchange={handleFieldChange} disabled={disableCategoria} required></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox name="assunto" label={fieldLabels.assunto} value={model.assunto} options={assuntoOptions} onchange={handleFieldChange} disabled={disableAssunto}></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox name="subassunto" label={fieldLabels.subassunto} value={model.subassunto} options={subassuntoOptions} onchange={handleFieldChange} disabled={disableSubassunto}></lightning-combobox>
                    </div>
                </div>

                <template if:true={showDestinationSection}>
                    <h3 class="slds-text-title_bold slds-m-bottom_small">{labels.destinationTitle}</h3>
                    <div class="slds-m-bottom_medium">
                        <div class="destination-grid">
                            <template for:each={destinationCards} for:item="card">
                                <template if:true={card.checked}>
                                    <button
                                        key={card.value}
                                        class="destination-card destination-card_selected"
                                        data-value={card.value}
                                        onclick={handleDestinationCardSelect}
                                        type="button"
                                    >
                                        <div class="destination-radio">◉</div>
                                        <div class="destination-content">
                                            <div class="destination-label">{card.label}</div>
                                        </div>
                                    </button>
                                </template>
                                <template if:false={card.checked}>
                                    <button
                                        key={card.value}
                                        class="destination-card"
                                        data-value={card.value}
                                        onclick={handleDestinationCardSelect}
                                        type="button"
                                    >
                                        <div class="destination-radio">◯</div>
                                        <div class="destination-content">
                                            <div class="destination-label">{card.label}</div>
                                        </div>
                                    </button>
                                </template>
                            </template>
                        </div>
                    </div>
                    <template if:true={resolvedQueue}>
                        <lightning-input label={labels.queueResolved} value={resolvedQueue.developerName} disabled></lightning-input>
                    </template>
                    <template if:true={showQueueSelector}>
                        <lightning-combobox label={labels.manualQueue} value={selectedQueueDeveloperName} options={queueOptions} onchange={handleQueueChange}></lightning-combobox>
                    </template>
                </template>

                <h3 class="slds-text-title_bold slds-m-bottom_small">{labels.summary}</h3>
                <div class="slds-box slds-theme_default slds-m-bottom_medium">
                    <p><strong>{labels.from}:</strong> {currentTipoCasoDisplay} | {currentCategoriaDisplay} | {currentAssuntoDisplay} | {readOnlySubassuntoAtual}</p>
                    <p><strong>{labels.to}:</strong> {newTipoCasoDisplay} | {newCategoriaDisplay} | {newAssuntoDisplay} | {readOnlySubassuntoNovo}</p>
                    <p class="slds-text-color_weak slds-m-top_x-small">{labels.warning}</p>
                </div>
                </template>
            </template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label={labels.cancel} onclick={cancel}></lightning-button>
        <lightning-button variant="brand" label={labels.save} onclick={submitRecategorization} disabled={loading} class="slds-m-left_x-small"></lightning-button>
    </lightning-modal-footer>
</template>
