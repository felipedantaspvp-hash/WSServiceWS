<template>
    <lightning-quick-action-panel header={labels.header}>
        <div class="slds-p-around_medium">
            <template if:true={loading}>
                <lightning-spinner alternative-text={labels.loading}></lightning-spinner>
            </template>

            <template if:false={loading}>
                <template if:true={errorMessage}>
                    <div class="slds-box slds-theme_error slds-m-bottom_medium" role="alert">
                        <p>{errorMessage}</p>
                    </div>
                </template>

                <template if:false={errorMessage}>
                    <template if:true={hasCandidates}>
                        <p class="slds-text-body_regular slds-m-bottom_medium">{labels.intro}</p>

                        <template for:each={candidates} for:item="candidate">
                            <article key={candidate.messagingEndUserId} class="slds-box slds-box_x-small slds-m-bottom_small">
                                <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                            <lightning-icon
                                                icon-name="standard:messaging_conversation"
                                                size="small"
                                                alternative-text={labels.channel}>
                                            </lightning-icon>
                                            <strong class="slds-m-left_x-small">{candidate.messagingChannelName}</strong>
                                            <template if:true={candidate.recommended}>
                                                <lightning-badge class="slds-m-left_x-small" label={labels.recommended}></lightning-badge>
                                            </template>
                                        </div>
                                        <p class="slds-text-body_small">{candidate.messagingPlatformKey}</p>
                                        <p class="slds-text-color_weak slds-text-body_small">{candidate.messagingConsentStatus}</p>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right slds-m-top_small">
                                        <div>
                                            <lightning-button
                                                variant="brand"
                                                label={labels.sendMessage}
                                                data-id={candidate.messagingEndUserId}
                                                onclick={sendMessage}>
                                            </lightning-button>
                                        </div>
                                        <div class="slds-m-top_x-small">
                                            <lightning-button
                                                label={labels.openMessagingUser}
                                                data-id={candidate.messagingEndUserId}
                                                onclick={openMessagingUser}>
                                            </lightning-button>
                                        </div>
                                    </div>
                                </div>
                            </article>
                        </template>
                    </template>

                    <template if:false={hasCandidates}>
                        <div class="slds-box slds-theme_info" role="status">
                            <p>{labels.emptyState}</p>
                        </div>
                    </template>
                </template>
            </template>
        </div>

        <div slot="footer" class="slds-grid slds-grid_align-end slds-gutters_x-small">
            <lightning-button label={labels.close} onclick={close}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
