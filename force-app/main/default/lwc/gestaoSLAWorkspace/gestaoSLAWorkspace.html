<template>
    <div class="workspace-shell">
        <div class="left-rail" aria-hidden="true"></div>

        <div class="workspace-main">
            <template if:true={loading}>
                <lightning-spinner alternative-text={labels.spinnerLoading}></lightning-spinner>
            </template>

            <template if:true={accessDenied}>
                <lightning-card title={labels.accessDeniedTitle} icon-name="utility:lock">
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        {labels.accessDeniedMessage}
                    </div>
                </lightning-card>
            </template>

            <template if:true={hasError}>
                <lightning-card title="Erro" icon-name="utility:error">
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        {errorMessage}
                    </div>
                </lightning-card>
            </template>

            <template if:true={noGestao}>
                <lightning-card title={labels.gestaoLabel} icon-name="utility:warning">
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        {noGestaoMessage}
                    </div>
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        <template if:true={canCreateGestao}>
                            <lightning-button
                                label={labels.gestaoNewButton}
                                variant="brand"
                                onclick={openCreateModal}
                            ></lightning-button>
                        </template>
                    </div>
                </lightning-card>
            </template>

            <template if:true={hasGestao}>
                <div class="breadcrumb">{breadcrumbLabel}</div>
                <template if:true={canShowTechnical}>
                    <div class="gestao-switcher-bar">
                        <div class="gestao-switcher-left">
                            <span class="gestao-switcher-label">{labels.gestaoLabel}</span>
                            <template if:true={showGestaoSelector}>
                                <lightning-combobox
                                    class="gestao-switcher-combobox"
                                    value={selectedGestaoSLAId}
                                    options={gestaoOptions}
                                    onchange={handleGestaoChange}
                                ></lightning-combobox>
                            </template>
                        </div>
                        <template if:true={canCreateGestao}>
                            <div class="slds-button-group" role="group">
                                <lightning-button
                                    label={labels.gestaoReactivateButton}
                                    variant="neutral"
                                    onclick={openReactivateModal}
                                ></lightning-button>
                                <lightning-button
                                    label={labels.gestaoNewButton}
                                    variant="brand"
                                    onclick={openCreateModal}
                                    class="slds-m-left_x-small"
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </template>

                <section class="header-card">
                    <div class="header-banner">
                        <template if:true={hasHeaderStaticImage}>
                            <img src={headerBannerImageUrl} alt={labels.gestaoBannerAlt} class="header-banner-image" />
                        </template>
                        <div class="header-banner-overlay">
                            <template if:false={hasHeaderStaticImage}>
                                <lightning-icon icon-name="utility:anchor" size="small" class="banner-icon"></lightning-icon>
                                <div class="banner-text">
                                    <p class="banner-caption">{labels.categoryBusinessUnit}</p>
                                    <h1>{gestao.name}</h1>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="header-details">
                        <div class="header-grid">
                            <div>
                                <p class="detail-label">{labels.categoryBusinessUnit}</p>
                                <p class="detail-value">{gestao.unidadeNegocio}</p>
                            </div>
                            <div>
                                <p class="detail-label">{labels.categoryStatusField}</p>
                                <span class={statusClass}>{statusLabel}</span>
                            </div>
                            <template if:true={canShowTechnical}>
                                <div>
                                    <p class="detail-label">{labels.gestaoEntitlementProcess}</p>
                                    <p class="detail-value">{gestao.entitlementProcessName}</p>
                                </div>
                                <div>
                                    <p class="detail-label">{labels.gestaoBusinessHours}</p>
                                    <p class="detail-value">{gestao.businessHoursName}</p>
                                </div>
                            </template>
                            <template if:true={gestao.usaTempoTriagem}>
                                <div>
                                    <p class="detail-label">{labels.gestaoTriageTime}</p>
                                    <p class="detail-value">{gestao.tempoTriagemMinutos} min</p>
                                </div>
                            </template>
                            <template if:true={gestao.usaTempoRespostaChat}>
                                <div>
                                    <p class="detail-label">{labels.gestaoChatResponseTime}</p>
                                    <p class="detail-value">{gestao.tempoRespostaChatMinutos} min</p>
                                </div>
                            </template>
                            <template if:true={gestao.usaTempoFilaEmail}>
                                <div>
                                    <p class="detail-label">{labels.gestaoEmailQueueTime}</p>
                                    <p class="detail-value">{gestao.tempoFilaEmailMinutos} min</p>
                                </div>
                            </template>
                        </div>
                        <div class="header-actions">
                            <template if:true={canEditGestao}>
                                <lightning-button
                                    label={labels.gestaoEditButton}
                                    variant="neutral"
                                    onclick={openEditModal}
                                ></lightning-button>
                            </template>
                            <template if:true={permissions.canAdminTechnicalSettings}>
                                <lightning-button
                                    class="slds-m-left_x-small"
                                    label={labels.gestaoDeleteButton}
                                    variant="destructive"
                                    onclick={handleDeleteGestao}
                                ></lightning-button>
                            </template>
                        </div>
                    </div>
                </section>

                <div class="content-grid">
                    <div class="content-main">
                        <div class="top-tabs">
                            <button class={categoriasTabClass} data-tab="categorias" onclick={handleTabClick}>
                                {labels.categoryTabTitle}
                            </button>
                            <button class={regrasTabClass} data-tab="regras" onclick={handleTabClick}>
                                {labels.rulesTabTitle}
                            </button>
                            <template if:true={showConfigTab}>
                                <button class={configTabClass} data-tab="config" onclick={handleTabClick}>
                                    {labels.technicalSettingsTabTitle} <span class="admin-pill">Admin</span>
                                </button>
                            </template>
                        </div>

                        <template if:true={activeIsCategorias}>
                            <section class="panel">
                                <template if:true={permissions.canManageCategories}>
                                    <div class="categoria-action-row">
                                        <lightning-button
                                            label={labels.categoryReactivateButton}
                                            variant="neutral"
                                            onclick={openReactivateCategoriaModal}
                                        ></lightning-button>
                                        <lightning-button
                                            label={labels.categoryNewButton}
                                            variant="brand"
                                            onclick={openCreateCategoriaModal}
                                        ></lightning-button>
                                    </div>
                                </template>
                                <div class="filters-row">
                                    <lightning-input
                                        type="search"
                                        placeholder={labels.categorySearchPlaceholder}
                                        value={searchTerm}
                                        onchange={handleSearchChange}
                                    ></lightning-input>
                                    <lightning-combobox value={filtroTipoCaso} options={tipoCasoOptions} onchange={handleFilterTipoCaso}></lightning-combobox>
                                    <lightning-combobox value={filtroCategoria} options={categoriaOptions} onchange={handleFilterCategoria}></lightning-combobox>
                                    <lightning-combobox value={filtroAssunto} options={assuntoOptions} onchange={handleFilterAssunto}></lightning-combobox>
                                    <lightning-combobox value={filtroAtivo} options={ativoOptions} onchange={handleFilterAtivo}></lightning-combobox>
                                </div>

                                <template if:true={hasCategorias}>
                                    <div class="table-scroll">
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                            <thead>
                                                <tr>
                                                    <th>{labels.categoryCaseType}</th>
                                                    <th>{labels.categoryLabel}</th>
                                                    <th>{labels.categorySubject}</th>
                                                    <th>{labels.categorySubsubject}</th>
                                                    <th>{labels.categorySuggestedPriority}</th>
                                                    <th>{labels.categoryActiveColumn}</th>
                                                    <th>{labels.categorySlaRules}</th>
                                                    <th>{labels.categoryActions}</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={pagedCategorias} for:item="row">
                                                    <tr key={row.id}>
                                                        <td>{row.tipoCasoLabel}</td>
                                                        <td>{row.categoriaLabel}</td>
                                                        <td>{row.assuntoLabel}</td>
                                                        <td>{row.subassuntoLabel}</td>
                                                        <td><span class={row.prioridadeBadgeClass}>{row.prioridadeSugerida}</span></td>
                                                        <td><span class={row.ativoClass}>{row.ativoLabel}</span></td>
                                                        <td>{row.totalRegrasLabel}</td>
                                                        <td>
                                                            <lightning-button-menu
                                                                icon-name="utility:down"
                                                                alternative-text={labels.categoryActions}
                                                                menu-alignment="right"
                                                                variant="border-filled"
                                                                data-id={row.id}
                                                                onselect={handleCategoriaAction}
                                                            >
                                                                <template if:true={permissions.canManageCategories}>
                                                                    <lightning-menu-item
                                                                        value="edit"
                                                                        label={labels.categoryEdit}
                                                                        prefix-icon-name="utility:edit"
                                                                    ></lightning-menu-item>
                                                                    <lightning-menu-item
                                                                        value="deactivate"
                                                                        label={labels.categoryDeactivate}
                                                                        prefix-icon-name="utility:clear"
                                                                    ></lightning-menu-item>
                                                                </template>
                                                                <lightning-menu-item
                                                                    value="configure-sla"
                                                                    label={labels.categoryConfigureSla}
                                                                    prefix-icon-name="utility:settings"
                                                                    disabled={disableManageRules}
                                                                ></lightning-menu-item>
                                                                <template if:true={permissions.canAdminTechnicalSettings}>
                                                                    <lightning-menu-item
                                                                        value="delete"
                                                                        label={labels.categoryDelete}
                                                                        prefix-icon-name="utility:delete"
                                                                    ></lightning-menu-item>
                                                                </template>
                                                            </lightning-button-menu>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>

                                    <div class="pagination-row">
                                        <div class="pagination-left">
                                            <div class="slds-form-element page-size-form">
                                                <lightning-combobox
                                                    class="page-size-combobox"
                                                    variant="label-hidden"
                                                    value={pageSize}
                                                    options={pageSizeOptions}
                                                    onchange={handlePageSizeChange}
                                                ></lightning-combobox>
                                            </div>
                                            <span class="page-range-label">{rangeLabel}</span>
                                        </div>
                                        <div class="pagination-actions">
                                            <lightning-button label={labels.categoryPaginationFirst} variant="neutral" disabled={disableGoPrevious} onclick={handleFirstPage}></lightning-button>
                                            <lightning-button label={labels.categoryPaginationPrevious} variant="neutral" disabled={disableGoPrevious} onclick={handlePreviousPage}></lightning-button>
                                            <span>{currentPage} / {totalPages}</span>
                                            <lightning-button label={labels.categoryPaginationNext} variant="neutral" disabled={disableGoNext} onclick={handleNextPage}></lightning-button>
                                            <lightning-button label={labels.categoryPaginationLast} variant="neutral" disabled={disableGoNext} onclick={handleLastPage}></lightning-button>
                                        </div>
                                    </div>
                                </template>

                                <template if:false={hasCategorias}>
                                    <div class="empty-state">{labels.categoryEmptyState}</div>
                                </template>
                            </section>
                        </template>

                        <template if:true={activeIsRegras}>
                            <section class="panel">
                                <div class="regras-header-row">
                                    <h3>{labels.rulesTabTitle}</h3>
                                    <template if:true={permissions.canManageRules}>
                                        <lightning-button
                                            label={labels.ruleNewButton}
                                            variant="brand"
                                            onclick={openCreateRegraModal}
                                        ></lightning-button>
                                    </template>
                                </div>

                                <div class="global-times-grid">
                                    <template if:true={gestao.usaTempoTriagem}>
                                        <article class="global-time-card">
                                            <p class="detail-label">{labels.globalTime}</p>
                                            <h4>{labels.milestoneTriageLabel}</h4>
                                            <p class="global-time-value">{gestao.tempoTriagemMinutos} min</p>
                                            <p>{labels.sourceManagementLabel}</p>
                                            <p>{labels.applicationEmailNew}</p>
                                        </article>
                                    </template>
                                    <template if:true={gestao.usaTempoRespostaChat}>
                                        <article class="global-time-card">
                                            <p class="detail-label">{labels.globalTime}</p>
                                            <h4>{labels.milestoneChatResponseLabel}</h4>
                                            <p class="global-time-value">{gestao.tempoRespostaChatMinutos} min</p>
                                            <p>{labels.sourceManagementLabel}</p>
                                            <p>{labels.applicationWhatsappChatNew}</p>
                                        </article>
                                    </template>
                                    <template if:true={gestao.usaTempoFilaEmail}>
                                        <article class="global-time-card">
                                            <p class="detail-label">{labels.globalTime}</p>
                                            <h4>{labels.milestoneEmailQueueLabel}</h4>
                                            <p class="global-time-value">{gestao.tempoFilaEmailMinutos} min</p>
                                            <p>{labels.sourceManagementLabel}</p>
                                            <p>{labels.applicationEmailNew}</p>
                                        </article>
                                    </template>
                                </div>

                                <template if:true={hasRegrasCategorizacaoContext}>
                                    <div class="filter-context">
                                        <span>{labels.rulesFilteredFor} {regrasCategorizacaoContextLabel}</span>
                                        <lightning-button
                                            label={labels.rulesClearFilter}
                                            variant="base"
                                            onclick={handleClearRegrasCategoriaFilter}
                                        ></lightning-button>
                                    </div>
                                </template>

                                <div class="regras-filters-row">
                                    <lightning-combobox
                                        name="regrasFiltroCategorizacaoId"
                                        value={regrasFiltroCategorizacaoId}
                                        options={regrasCategorizacaoOptions}
                                        onchange={handleRegraFilterChange}
                                    ></lightning-combobox>
                                    <lightning-combobox
                                        name="regrasFiltroMarcoSLAId"
                                        value={regrasFiltroMarcoSLAId}
                                        options={regrasMarcoOptions}
                                        onchange={handleRegraFilterChange}
                                    ></lightning-combobox>
                                    <lightning-combobox
                                        name="regrasFiltroEscopo"
                                        value={regrasFiltroEscopo}
                                        options={regrasEscopoOptions}
                                        onchange={handleRegraFilterChange}
                                    ></lightning-combobox>
                                    <template if:true={showAreaInternasFilter}>
                                        <lightning-combobox
                                            label={labels.ruleColInternalArea}
                                            name="regrasFiltroAreaAtendimento"
                                            value={regrasFiltroAreaAtendimento}
                                            options={regrasFiltroAreaAtendimentoOptions}
                                            onchange={handleRegraFilterChange}
                                        ></lightning-combobox>
                                    </template>
                                    <lightning-combobox
                                        name="regrasFiltroAtivo"
                                        value={regrasFiltroAtivo}
                                        options={ativoOptions}
                                        onchange={handleRegraFilterChange}
                                    ></lightning-combobox>
                                </div>

                                <template if:true={loadingRegras}>
                                    <lightning-spinner alternative-text={labels.rulesSpinnerLoading}></lightning-spinner>
                                </template>

                                <template if:true={hasRegrasSLA}>
                                    <div class="table-scroll">
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                            <thead>
                                                <tr>
                                                    <th>{labels.ruleColCategorization}</th>
                                                    <th>{labels.ruleColMilestone}</th>
                                                    <th>{labels.ruleColScope}</th>
                                                    <th>{labels.ruleColInternalArea}</th>
                                                    <th>{labels.ruleColTimeLow}</th>
                                                    <th>{labels.ruleColTimeMedium}</th>
                                                    <th>{labels.ruleColTimeHigh}</th>
                                                    <th>{labels.categoryStatusField}</th>
                                                    <th>{labels.categoryActions}</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={regrasSLA} for:item="row">
                                                    <tr key={row.id}>
                                                        <td>{row.categorizacaoNome}</td>
                                                        <td>{row.marcoNome}</td>
                                                        <td>{row.escopoRegra}</td>
                                                        <td>{row.areaAtendimento}</td>
                                                        <td>{row.tempoBaixaLabel}</td>
                                                        <td>{row.tempoMediaLabel}</td>
                                                        <td>{row.tempoAltaLabel}</td>
                                                        <td><span class={row.ativoClass}>{row.ativoLabel}</span></td>
                                                                        <td>
                                                            <template if:true={permissions.canManageRules}>
                                                                <lightning-button-menu
                                                                    icon-name="utility:down"
                                                                    alternative-text={labels.categoryActions}
                                                                    menu-alignment="right"
                                                                    variant="border-filled"
                                                                    data-id={row.id}
                                                                    onselect={handleRegraAction}
                                                                >
                                                                    <lightning-menu-item
                                                                        value="edit"
                                                                        label={labels.categoryEdit}
                                                                        prefix-icon-name="utility:edit"
                                                                    ></lightning-menu-item>
                                                                    <template if:true={row.ativo}>
                                                                        <lightning-menu-item
                                                                            value="deactivate"
                                                                            label={labels.categoryDeactivate}
                                                                            prefix-icon-name="utility:clear"
                                                                        ></lightning-menu-item>
                                                                    </template>
                                                                    <template if:false={row.ativo}>
                                                                        <lightning-menu-item
                                                                            value="activate"
                                                                            label={labels.activateRule}
                                                                            prefix-icon-name="utility:check"
                                                                        ></lightning-menu-item>
                                                                    </template>
                                                                    <template if:true={permissions.canAdminTechnicalSettings}>
                                                                        <lightning-menu-item
                                                                            value="delete"
                                                                            label={labels.ruleDelete}
                                                                            prefix-icon-name="utility:delete"
                                                                        ></lightning-menu-item>
                                                                    </template>
                                                                </lightning-button-menu>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>

                                <template if:false={hasRegrasSLA}>
                                    <div class="empty-state">{labels.rulesEmptyState}</div>
                                </template>
                            </section>
                        </template>

                        <template if:true={activeIsConfig}>
                            <section class="panel placeholder">
                                <h3>{labels.technicalSettingsTabTitle}</h3>
                                <p>{labels.gestaoEntitlementProcess}: {gestao.entitlementProcessName}</p>
                                <p>{labels.gestaoBusinessHours}: {gestao.businessHoursName}</p>
                                <p>Static Resource: {gestao.staticResourceName}</p>
                                <p>{labels.categoryBusinessUnit}: {gestao.unidadeNegocio}</p>
                            </section>
                        </template>
                    </div>

                    <aside class="summary-card">
                        <h3>{labels.gestaoSummaryTitle}</h3>
                        <div class="summary-item">
                            <lightning-icon icon-name="utility:bookmark" size="x-small"></lightning-icon>
                            <span>{summary.totalCategorias} {labels.categorySummaryActive}</span>
                        </div>
                        <div class="summary-item">
                            <lightning-icon icon-name="utility:metrics" size="x-small"></lightning-icon>
                            <span>{totalMarcosLabel} {labels.gestaoSummaryAvailableMilestones}</span>
                        </div>
                        <div class="summary-item">
                            <lightning-icon icon-name="utility:groups" size="x-small"></lightning-icon>
                            <span>{totalAreasInternasLabel} {labels.gestaoSummaryInternalAreasN3}</span>
                        </div>
                        <div class="summary-item">
                            <lightning-icon icon-name="utility:clock" size="x-small"></lightning-icon>
                            <span>{labels.gestaoSummaryLastUpdated}: {labels.gestaoToday}</span>
                        </div>
                        <lightning-button
                            class="summary-button"
                            label={labels.gestaoViewReports}
                            variant="neutral"
                            data-action="verRelatorios"
                            onclick={handlePlaceholderAction}
                        ></lightning-button>
                    </aside>
                </div>
            </template>

            <template if:true={showCreateModal}>
                <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">{labels.gestaoNewButton}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <div class="create-form-scope">
                            <template if:true={savingGestao}>
                                <lightning-spinner alternative-text={labels.spinnerSaving}></lightning-spinner>
                            </template>
                            <lightning-input
                                lwc:ref="createName"
                                label={labels.fieldName}
                                name="name"
                                data-scope="create"
                                data-field="name"
                                value={createForm.name}
                                oninput={handleCreateInputChange}
                                onchange={handleCreateInputChange}
                                required
                            ></lightning-input>
                            <lightning-combobox
                                lwc:ref="createUnidadeNegocio"
                                label={labels.categoryBusinessUnit}
                                name="unidadeNegocio"
                                data-scope="create"
                                data-field="unidadeNegocio"
                                value={createForm.unidadeNegocio}
                                options={unidadeNegocioOptions}
                                oninput={handleCreateInputChange}
                                onchange={handleCreateInputChange}
                                required
                            ></lightning-combobox>
                            <lightning-input
                                lwc:ref="createEntitlementProcessName"
                                label={labels.gestaoEntitlementProcess}
                                name="entitlementProcessName"
                                data-scope="create"
                                data-field="entitlementProcessName"
                                value={createForm.entitlementProcessName}
                                oninput={handleCreateInputChange}
                                onchange={handleCreateInputChange}
                                required
                            ></lightning-input>
                            <lightning-input
                                lwc:ref="createBusinessHoursName"
                                label={labels.gestaoBusinessHours}
                                name="businessHoursName"
                                data-scope="create"
                                data-field="businessHoursName"
                                value={createForm.businessHoursName}
                                oninput={handleCreateInputChange}
                                onchange={handleCreateInputChange}
                                required
                            ></lightning-input>
                            <lightning-input
                                lwc:ref="createStaticResourceName"
                                label="Static Resource"
                                name="staticResourceName"
                                data-scope="create"
                                data-field="staticResourceName"
                                value={createForm.staticResourceName}
                                oninput={handleCreateInputChange}
                                onchange={handleCreateInputChange}
                            ></lightning-input>

                            <div class="slds-m-top_medium slds-m-bottom_x-small">
                                <p class="slds-text-title_caps slds-text-color_weak">{labels.gestaoMarcosUnicosSectionTitle}</p>
                            </div>
                            <div class="slds-grid slds-wrap slds-gutters_x-small marco-unico-row">
                                <div class="slds-col slds-size_1-of-2">
                                    <label class="slds-form-element__label marco-unico-label">{labels.usaTriageTime}</label>
                                    <lightning-input
                                        lwc:ref="createUsaTempoTriagem"
                                        variant="label-hidden"
                                        type="toggle"
                                        label={labels.usaTriageTime}
                                        name="usaTempoTriagem"
                                        data-scope="create"
                                        data-field="usaTempoTriagem"
                                        checked={createForm.usaTempoTriagem}
                                        onchange={handleCreateInputChange}
                                    ></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2 marco-unico-value-col">
                                    <template if:true={createForm.usaTempoTriagem}>
                                        <label class="slds-form-element__label marco-unico-label"><abbr class="slds-required" title="required">*</abbr>{labels.fieldTriageTimeMin}</label>
                                        <lightning-input
                                            lwc:ref="createTempoTriagemMinutos"
                                            variant="label-hidden"
                                            type="number"
                                            label={labels.fieldTriageTimeMin}
                                            name="tempoTriagemMinutos"
                                            data-scope="create"
                                            data-field="tempoTriagemMinutos"
                                            value={createForm.tempoTriagemMinutos}
                                            oninput={handleCreateInputChange}
                                            onchange={handleCreateInputChange}
                                            required
                                        ></lightning-input>
                                    </template>
                                </div>
                            </div>
                            <div class="slds-grid slds-wrap slds-gutters_x-small marco-unico-row">
                                <div class="slds-col slds-size_1-of-2">
                                    <label class="slds-form-element__label marco-unico-label">{labels.usaChatResponseTime}</label>
                                    <lightning-input
                                        lwc:ref="createUsaTempoRespostaChat"
                                        variant="label-hidden"

                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <template if:true={showReactivateCategoriaModal}>
                <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container slds-modal_large">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">{labels.categoryReactivateModalTitle}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <template if:true={loadingInactiveCategorias}>
                                <lightning-spinner alternative-text={labels.categoryReactivateModalLoadingAlt}></lightning-spinner>
                            </template>
                            <template if:true={hasInactiveCategorias}>
                                <div class="table-scroll">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                        <thead>
                                            <tr>
                                                <th>{labels.categoryReactivateModalSelect}</th>
                                                <th>{labels.categoryCaseType}</th>
                                                <th>{labels.categoryLabel}</th>
                                                <th>{labels.categorySubject}</th>
                                                <th>{labels.categorySubsubject}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={inactiveCategorias} for:item="row">
                                                <tr key={row.id}>
                                                    <td>
                                                        <lightning-input
                                                            type="radio"
                                                            name="inactiveCategoriaSelector"
                                                            value={row.id}
                                                            checked={row.selected}
                                                            onchange={handleSelectInactiveCategoria}
                                                            variant="label-hidden"
                                                        ></lightning-input>
                                                    </td>
                                                    <td>{row.tipoCasoLabel}</td>
                                                    <td>{row.categoriaLabel}</td>
                                                    <td>{row.assuntoLabel}</td>
                                                    <td>{row.subassuntoLabel}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                            <template if:false={hasInactiveCategorias}>
                                <div class="empty-state">{labels.categoryReactivateModalEmpty}</div>
                            </template>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button label={labels.categoryModalCancel} onclick={closeReactivateCategoriaModal}></lightning-button>
                            <lightning-button
                                variant="brand"
                                label={labels.categoryReactivateModalConfirm}
                                onclick={handleConfirmReactivateCategoria}
                                class="slds-m-left_small"
                                disabled={reactivatingCategoria}
                            ></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
    </div>
</template>
